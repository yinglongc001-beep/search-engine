services:
  - type: web
    name: multiple-vin-search
    runtime: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 300 app:app
    disk:
      name: vin-search-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PUBLIC_DEPLOYMENT
        value: "1"
      - key: DATABASE_PATH
        value: /var/data/users.sqlite3
      - key: ADMIN_USERNAME
        value: leo.chen
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
