<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Multiple VIN Search</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body><main class="auth-shell"><h1>Multiple VIN Search System</h1><section class="auth-card"><h2>Sign in</h2>{% if error %}<p class="notice error">{{ error }}</p>{% endif %}{% if message %}<p class="notice">{{ message }}</p>{% endif %}<form method="post" action="{{ url_for('login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="primary" type="submit">Sign in</button></form><p class="auth-foot">New here? <a href="{{ url_for('register') }}">Create an account</a></p></section></main></body></html>
