<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · Multiple VIN Search</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body><main class="auth-shell"><h1>Multiple VIN Search System</h1><section class="auth-card"><h2>Create account</h2>{% if error %}<p class="notice error">{{ error }}</p>{% endif %}<form method="post" action="{{ url_for('register') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Username<input name="username" autocomplete="username" required minlength="3" maxlength="40"></label><label>Password<input type="password" name="password" autocomplete="new-password" required minlength="10"></label><p class="hint">Use at least 10 characters. Only your username is visible to the administrator; passwords are stored as hashes.</p><button class="primary" type="submit">Register</button></form><p class="auth-foot">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></section></main></body></html>
